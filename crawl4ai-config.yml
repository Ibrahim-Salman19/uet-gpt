# Standalone crawl4ai server config. Bind to loopback by default so the server is
# not exposed on all interfaces. Only change `host` to 0.0.0.0 if remote access is
# genuinely required AND `security.enabled` below is set to true (auth on).
app:
  host: "127.0.0.1"
  port: 8020
  timeout_keep_alive: 300

crawler:
  memory_threshold_percent: 80.0
  rate_limiter:
    base_delay: [2.0, 3.5]
  timeouts:
    stream_init: 30.0
    batch_process: 600.0

rate_limiting:
  enabled: true
  default_limit: "100/minute"

# Keep auth enabled unless the server is reachable only from localhost. If `host`
# is ever changed to a non-loopback address, this MUST be true.
security:
  enabled: true
