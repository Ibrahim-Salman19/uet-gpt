name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        default: "production"
        type: choice
        options:
          - production
          - preview

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

# Least-privilege default token. Deploy auth is via the Convex/Vercel tokens in
# job env, not the GITHUB_TOKEN, so contents:read is sufficient.
permissions:
  contents: read

jobs:
  # Validate the frontend build BEFORE anything is deployed. If the Next.js
  # build is broken we fail here, so Convex is never deployed against a frontend
  # that cannot build (avoids a live backend paired with a stale/broken frontend).
  build:
    name: Build Frontend (gate)
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'production' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      # No `version:` input — action-setup reads the pinned pnpm version from
      # package.json `packageManager` (pnpm@11.1.3), keeping a single source of truth.
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Get pnpm store directory
        id: pnpm-store
        run: echo "store=$(pnpm store path --silent)" >> $GITHUB_OUTPUT
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.pnpm-store.outputs.store }}
          key: pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Convex types
        run: npx convex@latest codegen
        env:
          CONVEX_DEPLOYMENT: ${{ secrets.CONVEX_DEPLOYMENT }}
      - name: Build Next.js
        run: pnpm build
        env:
          CONVEX_DEPLOYMENT: ${{ secrets.CONVEX_DEPLOYMENT }}
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_JWT_ISSUER: ${{ secrets.CLERK_JWT_ISSUER }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}

  deploy-convex:
    name: Deploy Convex Backend
    runs-on: ubuntu-latest
    needs: [build]
    environment: ${{ inputs.environment || 'production' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      # No `version:` input — action-setup reads the pinned pnpm version from
      # package.json `packageManager` (pnpm@11.1.3), keeping a single source of truth.
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Get pnpm store directory
        id: pnpm-store
        run: echo "store=$(pnpm store path --silent)" >> $GITHUB_OUTPUT
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.pnpm-store.outputs.store }}
          key: pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Deploy Convex
        run: npx convex@latest deploy
        env:
          CONVEX_DEPLOYMENT: ${{ secrets.CONVEX_DEPLOYMENT }}
          CLERK_JWT_ISSUER: ${{ secrets.CLERK_JWT_ISSUER }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          CLERK_WEBHOOK_SECRET: ${{ secrets.CLERK_WEBHOOK_SECRET }}

  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: [deploy-convex]
    environment: ${{ inputs.environment || 'production' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      # No `version:` input — action-setup reads the pinned pnpm version from
      # package.json `packageManager` (pnpm@11.1.3), keeping a single source of truth.
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      # Official Vercel CLI flow. `vercel/actions/deploy@v2` does not exist as a
      # first-party action, so we use the documented CLI: pull project config,
      # build with Vercel, then deploy the prebuilt output (single build on Vercel).
      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          VERCEL_ENV="${{ inputs.environment == 'preview' && 'preview' || 'production' }}"
          pnpm dlx vercel@latest pull --yes --environment="$VERCEL_ENV" --token="$VERCEL_TOKEN"
          if [ "$VERCEL_ENV" = "production" ]; then
            pnpm dlx vercel@latest build --prod --token="$VERCEL_TOKEN"
            pnpm dlx vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"
          else
            pnpm dlx vercel@latest build --token="$VERCEL_TOKEN"
            pnpm dlx vercel@latest deploy --prebuilt --token="$VERCEL_TOKEN"
          fi
