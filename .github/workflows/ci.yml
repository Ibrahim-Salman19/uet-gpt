name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default token: these jobs only read the repo.
permissions:
  contents: read

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      # No `version:` input — action-setup reads the pinned pnpm version from
      # package.json `packageManager` (pnpm@11.1.3), keeping a single source of truth.
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      # setup-node's native pnpm cache keys on pnpm-lock.yaml automatically
      # (pnpm is installed above), replacing the manual store/cache dance.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Biome check (read-only)
        run: npx biome check src/ convex/

  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      # No `version:` input — action-setup reads the pinned pnpm version from
      # package.json `packageManager` (pnpm@11.1.3), keeping a single source of truth.
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      # setup-node's native pnpm cache keys on pnpm-lock.yaml automatically
      # (pnpm is installed above), replacing the manual store/cache dance.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Generate Convex `_generated` types OFFLINE so the type check always runs,
      # including on fork PRs that have no CONVEX_DEPLOYMENT secret. `codegen
      # --typecheck disable` does not contact a deployment, so the gate is real
      # for every PR rather than passing green when the secret is absent.
      - name: Generate Convex types (offline)
        run: npx convex@latest codegen --typecheck disable

      - name: Type check
        run: pnpm typecheck

  test:
    name: Unit Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      # No `version:` input — action-setup reads the pinned pnpm version from
      # package.json `packageManager` (pnpm@11.1.3), keeping a single source of truth.
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      # setup-node's native pnpm cache keys on pnpm-lock.yaml automatically
      # (pnpm is installed above), replacing the manual store/cache dance.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run tests
        run: pnpm test -- --run --reporter verbose

  audit:
    name: Dependency Audit (SCA)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      # No `version:` input — action-setup reads the pinned pnpm version from
      # package.json `packageManager` (pnpm@11.1.3), keeping a single source of truth.
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Fail CI on high/critical advisories (no `|| true`) so supply-chain
      # regressions are surfaced rather than silently merged.
      - name: Audit dependencies
        run: pnpm audit --audit-level=high

  e2e:
    name: E2E Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # The Playwright suite boots the real Next.js dev server and authenticates a
    # Clerk test user, both of which require Clerk + Convex credentials. Fork PRs
    # cannot access secrets, so this job only runs on push to main (matching the
    # `build` job). Without this gate the suite would be guaranteed-red on forks.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Provided to both the setup project (clerkSetup / clerk.signIn) and the
    # dev webServer that Playwright launches.
    env:
      NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
      CONVEX_DEPLOYMENT: ${{ secrets.CONVEX_DEPLOYMENT }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      CLERK_JWT_ISSUER: ${{ secrets.CLERK_JWT_ISSUER }}
      E2E_CLERK_USER_EMAIL: ${{ secrets.E2E_CLERK_USER_EMAIL }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      # No `version:` input — action-setup reads the pinned pnpm version from
      # package.json `packageManager` (pnpm@11.1.3), keeping a single source of truth.
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      # setup-node's native pnpm cache keys on pnpm-lock.yaml automatically
      # (pnpm is installed above), replacing the manual store/cache dance.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # The dev server imports Convex `_generated` modules at build/run time, so
      # generate them offline before launching Playwright's webServer.
      - name: Generate Convex types (offline)
        run: npx convex@latest codegen --typecheck disable
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run E2E tests
        run: pnpm test:e2e

  build:
    name: Build Check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # e2e is included so an e2e failure blocks the gated build (build runs only on
    # push to main, where e2e also runs). lint/typecheck/test gate as before.
    needs: [lint, typecheck, test, e2e]
    # Build only runs on push to main (not PRs) since it requires all secrets
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      # No `version:` input — action-setup reads the pinned pnpm version from
      # package.json `packageManager` (pnpm@11.1.3), keeping a single source of truth.
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      # setup-node's native pnpm cache keys on pnpm-lock.yaml automatically
      # (pnpm is installed above), replacing the manual store/cache dance.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Convex types
        run: npx convex@latest codegen
        env:
          CONVEX_DEPLOYMENT: ${{ secrets.CONVEX_DEPLOYMENT }}
      - name: Build
        run: pnpm build
        env:
          CONVEX_DEPLOYMENT: ${{ secrets.CONVEX_DEPLOYMENT }}
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_JWT_ISSUER: ${{ secrets.CLERK_JWT_ISSUER }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          CLERK_WEBHOOK_SECRET: ${{ secrets.CLERK_WEBHOOK_SECRET }}

  extraction-gate:
    # The Python extraction-quality gate (scripts/eval/run_extraction_eval.py).
    # Distinct from the JS/TS jobs above: it runs the captured corpus through the
    # real extractor under subprocess isolation and enforces precision/recall +
    # critical-fixture + determinism floors. The corpus is committed, so this
    # needs no secrets and no network access to UET.
    name: Extraction Quality Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Bounded concurrency: isolation spawns one subprocess per fixture; a single
    # job is memory-light, but don't let matrix fan-out exhaust CI memory.
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt
      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt
      - name: Compile-check all scripts
        run: python -m py_compile scripts/*.py scripts/eval/*.py scripts/corpus/*.py
      - name: Run extraction + corpus + isolation test suites
        run: |
          python -m pytest scripts/test_extraction_eval.py \
            scripts/test_corpus_integrity.py \
            scripts/test_corpus_manifest.py \
            scripts/test_isolation.py \
            -v
      - name: Run the extraction gate (strict, full isolation, vs baseline)
        # Default --isolation on; --isolation off is CI-forbidden. The corpus is
        # committed, so a changed universe means someone edited fixtures — fail
        # closed unless they regenerated the approved baseline.
        run: |
          python scripts/eval/run_extraction_eval.py \
            --baseline scripts/corpus/baseline_report.json \
            --output ${{ runner.temp }}/extraction_report.json
      - name: Publish extraction report + failed-fixture diagnostics
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: extraction-report
          path: |
            ${{ runner.temp }}/extraction_report.json
          if-no-files-found: warn
          retention-days: 30
